<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101012">
  <title>Calculator — Slate</title>
  <style>
    :root{color-scheme:dark;--bg:#101012;--panel:#19191d;--key:#29292e;--key-hover:#39393f;--text:#f5f5f7;--muted:#909097;--accent:#ff9f0a;--line:#ffffff12;--shadow:0 24px 70px #0007}
    [data-theme="light"]{color-scheme:light;--bg:#f1f2f5;--panel:#fff;--key:#ececf0;--key-hover:#dedee4;--text:#17171a;--muted:#777780;--line:#00000010;--shadow:0 24px 70px #26263820}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,color-mix(in srgb,var(--accent) 9%,var(--bg)),var(--bg) 56%);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;place-items:center;padding:32px 18px;transition:background .3s,color .3s}
    .app{width:min(100%,930px);display:grid;grid-template-columns:minmax(320px,440px) minmax(230px,1fr);gap:24px;align-items:stretch}.calculator,.history{background:color-mix(in srgb,var(--panel) 96%,transparent);border:1px solid var(--line);border-radius:32px;box-shadow:var(--shadow);backdrop-filter:blur(18px)}.calculator{padding:24px;display:flex;flex-direction:column;min-height:690px}.topbar{display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}.brand-mark{width:28px;height:28px;border-radius:9px;background:var(--accent);color:white;display:grid;place-items:center;font-size:16px}.icon-btn{border:1px solid var(--line);color:var(--text);background:var(--key);width:40px;height:40px;border-radius:14px;cursor:pointer;font-size:17px;transition:transform .18s,background .18s}.icon-btn:hover{background:var(--key-hover);transform:translateY(-2px)}
    .display{margin:34px 2px 24px;min-height:142px;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-end;overflow:hidden}.expression{width:100%;min-height:25px;text-align:right;font-size:16px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.result{width:100%;text-align:right;font-size:clamp(48px,9vw,72px);font-weight:300;letter-spacing:-.055em;line-height:1.12;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.result.error{color:#ff6259}.keypad{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:auto}.key{border:0;border-radius:22px;min-height:68px;background:var(--key);color:var(--text);font:500 21px inherit;font-size:21px;cursor:pointer;transition:transform .12s,filter .18s,background .18s;user-select:none;-webkit-tap-highlight-color:transparent}.key:hover{background:var(--key-hover)}.key:active{transform:scale(.93);filter:brightness(1.2)}.key.utility{font-size:16px;color:var(--muted);font-weight:650}.key.operator{background:var(--accent);color:#fff;font-size:25px}.key.operator:hover,.key.equals:hover{filter:brightness(1.1)}.key.equals{background:var(--accent);color:#fff;font-size:25px}.key.zero{grid-column:span 2;text-align:left;padding-left:28px}.key small{font-size:11px;opacity:.75;margin-left:2px}
    .history{padding:26px;display:flex;flex-direction:column;min-height:690px}.history-head{display:flex;align-items:center;justify-content:space-between;padding-bottom:18px;border-bottom:1px solid var(--line)}.history-title{margin:0;font-size:17px;font-weight:650;letter-spacing:-.02em}.clear-history{border:0;background:none;color:var(--accent);font:600 12px inherit;font-size:12px;cursor:pointer}.clear-history:hover{opacity:.75}.history-list{list-style:none;margin:0;padding:10px 0;overflow:auto}.history-item{padding:15px 2px;border-bottom:1px solid var(--line);cursor:pointer;transition:opacity .18s}.history-item:hover{opacity:.75}.history-expression{text-align:right;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.history-result{text-align:right;font-size:23px;font-weight:500;margin-top:5px;letter-spacing:-.035em}.empty{margin:auto;text-align:center;color:var(--muted);font-size:13px;line-height:1.6}.empty-icon{font-size:27px;margin-bottom:9px;opacity:.6}.hint{margin-top:auto;padding-top:16px;color:var(--muted);font-size:11px;text-align:center}.kbd{border:1px solid var(--line);border-radius:5px;padding:2px 5px;font-size:10px}
    @media(max-width:740px){body{padding:16px 12px}.app{max-width:440px;grid-template-columns:1fr;gap:14px}.calculator{min-height:min(680px,calc(100dvh - 32px));padding:19px;border-radius:27px}.display{min-height:115px;margin:24px 2px 18px}.keypad{gap:10px}.key{min-height:clamp(56px,12vw,72px);border-radius:19px}.history{min-height:220px;max-height:300px;padding:20px;border-radius:27px}.history-list{max-height:190px}.hint{display:none}}
    @media(max-width:370px){.calculator{padding:15px}.keypad{gap:8px}.key{min-height:54px;font-size:19px}.key.utility{font-size:14px}.display{min-height:98px}.result{font-size:54px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <main class="app" aria-label="Calculator app">
    <section class="calculator" aria-label="Calculator">
      <header class="topbar"><div class="brand"><span class="brand-mark">＋</span> Slate Calculator</div><button class="icon-btn" id="themeToggle" aria-label="Switch color theme" title="Switch theme">☼</button></header>
      <div class="display" aria-live="polite"><div class="expression" id="expression">&nbsp;</div><div class="result" id="result">0</div></div>
      <div class="keypad" id="keypad">
        <button class="key utility" data-action="clear">AC</button><button class="key utility" data-action="sign">+/−</button><button class="key utility" data-action="percent">%</button><button class="key operator" data-action="operator" data-value="÷">÷</button>
        <button class="key" data-action="digit" data-value="7">7</button><button class="key" data-action="digit" data-value="8">8</button><button class="key" data-action="digit" data-value="9">9</button><button class="key operator" data-action="operator" data-value="×">×</button>
        <button class="key" data-action="digit" data-value="4">4</button><button class="key" data-action="digit" data-value="5">5</button><button class="key" data-action="digit" data-value="6">6</button><button class="key operator" data-action="operator" data-value="−">−</button>
        <button class="key" data-action="digit" data-value="1">1</button><button class="key" data-action="digit" data-value="2">2</button><button class="key" data-action="digit" data-value="3">3</button><button class="key operator" data-action="operator" data-value="+">+</button>
        <button class="key utility" data-action="mod">mod</button><button class="key zero" data-action="digit" data-value="0">0</button><button class="key" data-action="decimal">.</button><button class="key operator" data-action="square">x²</button>
        <button class="key utility" data-action="sqrt">√</button><button class="key utility" data-action="delete">DEL</button><button class="key equals" data-action="equals" style="grid-column:span 2">=</button>
      </div>
    </section>
    <aside class="history" aria-label="Calculation history"><div class="history-head"><h2 class="history-title">History</h2><button class="clear-history" id="clearHistory">Clear all</button></div><ul class="history-list" id="historyList"></ul><div class="empty" id="empty"><div class="empty-icon">◷</div>Your calculations will appear here</div><div class="hint">Keyboard supported · <span class="kbd">Enter</span> to calculate · <span class="kbd">Esc</span> to clear</div></aside>
  </main>
  <script>
    (()=>{
      const expressionEl=document.querySelector('#expression'),resultEl=document.querySelector('#result'),historyList=document.querySelector('#historyList'),emptyEl=document.querySelector('#empty');
      let expr='',justEvaluated=false,history=[];
      const displayExpr=s=>s.replace(/\*/g,'×').replace(/\//g,'÷').replace(/-/g,'−');
      const pretty=n=>{if(!Number.isFinite(n))throw Error('Cannot divide by zero');if(Object.is(n,-0))n=0;return String(Number(n.toPrecision(12)))};
      function tokenize(s){const out=[];let i=0;while(i<s.length){if(/\s/.test(s[i])){i++;continue}if(/[0-9.]/.test(s[i])){let start=i,dots=0;while(i<s.length&&/[0-9.]/.test(s[i])){if(s[i]==='.')dots++;i++}if(dots>1)throw Error('Invalid number');out.push({type:'num',value:Number(s.slice(start,i))});continue}if('+-*/%()'.includes(s[i])){out.push({type:s[i]==='('? 'lp':s[i]===')'?'rp':'op',value:s[i++]});continue}throw Error('Invalid input')}return out}
      function parse(s){const t=tokenize(s);let i=0;const primary=()=>{let x=t[i];if(!x)throw Error('Incomplete');if(x.type==='op'&&(x.value==='+'||x.value==='-')){i++;let v=primary();return x.value==='-'?-v:v}if(x.type==='num'){i++;return x.value}if(x.type==='lp'){i++;let v=add();if(!t[i]||t[i++].type!=='rp')throw Error('Missing )');return v}throw Error('Incomplete')};const postfix=()=>{let v=primary();while(t[i]?.type==='op'&&t[i].value==='%'){i++;v/=100}return v};const mul=()=>{let v=postfix();while(t[i]?.type==='op'&&['*','/','%'].includes(t[i].value)){let o=t[i++].value,b=postfix();if((o==='/'||o==='%')&&b===0)throw Error('Cannot divide by zero');v=o==='*'?v*b:o==='/'?v/b:v%b}return v};const add=()=>{let v=mul();while(t[i]?.type==='op'&&['+','-'].includes(t[i].value)){let o=t[i++].value,b=mul();v=o==='+'?v+b:v-b}return v};let v=add();if(i<t.length)throw Error('Incomplete');return v}
      function preview(){expressionEl.textContent=expr?displayExpr(expr):'\u00a0';resultEl.classList.remove('error');if(!expr){resultEl.textContent='0';return}try{resultEl.textContent=pretty(parse(expr))}catch{resultEl.textContent='…'}}
      function appendDigit(d){if(justEvaluated){expr='';justEvaluated=false}if(/(?:^|[+\-*/%])0$/.test(expr))expr=expr.slice(0,-1)+d;else expr+=d;preview()}
      function appendOp(op){if(!expr){if(op==='-')expr='-';preview();return}if(/[+\-*/%]$/.test(expr))expr=expr.slice(0,-1)+op;else expr+=op;justEvaluated=false;preview()}
      function calculate(save=true){if(!expr)return;try{const value=pretty(parse(expr)),shown=displayExpr(expr);if(save){history.unshift({expression:shown,result:value});history=history.slice(0,30);renderHistory()}expr=value;justEvaluated=true;preview()}catch{resultEl.textContent='Error';resultEl.classList.add('error')}}
      function renderHistory(){historyList.replaceChildren();emptyEl.hidden=history.length>0;history.forEach(item=>{const li=document.createElement('li');li.className='history-item';li.innerHTML='<div class="history-expression"></div><div class="history-result"></div>';li.children[0].textContent=item.expression+' =';li.children[1].textContent=item.result;li.addEventListener('click',()=>{expr=item.result;justEvaluated=true;preview()});historyList.append(li)})}
      document.querySelector('#keypad').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const {action,value}=b.dataset;switch(action){case'digit':appendDigit(value);break;case'decimal':if(justEvaluated){expr='';justEvaluated=false}if(!/[+\-*/%]$/.test(expr)&&!expr.split(/[+\-*/%]/).pop().includes('.'))expr+='.';preview();break;case'operator':appendOp(({ '×':'*','÷':'/','−':'-' }[value]||value));break;case'mod':appendOp('%');break;case'clear':expr='';justEvaluated=false;preview();break;case'delete':expr=expr.slice(0,-1);justEvaluated=false;preview();break;case'equals':calculate();break;case'percent':if(expr&&!/[+\-*/%]$/.test(expr)){expr+='%' ;justEvaluated=false;preview()}break;case'sign':{if(!expr){expr='-';preview();break}const m=expr.match(/(\d*\.?\d+)%?$/);if(m){const start=m.index,token=m[0],neg=expr.slice(0,start).endsWith('-')&&(start===1||/[+*/%]$/.test(expr.slice(0,start-1)));expr=expr.slice(0,start)+(neg?token:'-'+token);preview()}break}case'square':if(expr&&!/[+\-*/%]$/.test(expr)){try{expr=pretty(parse(expr)**2);justEvaluated=true;preview()}catch{}}break;case'sqrt':if(expr&&!/[+\-*/%]$/.test(expr)){try{let n=parse(expr);if(n<0)throw Error();expr=pretty(Math.sqrt(n));justEvaluated=true;preview()}catch{resultEl.textContent='Error';resultEl.classList.add('error')}}break}});
      document.querySelector('#clearHistory').addEventListener('click',()=>{history=[];renderHistory()});document.querySelector('#themeToggle').addEventListener('click',()=>{const light=document.documentElement.dataset.theme!=='light';document.documentElement.dataset.theme=light?'light':'dark';document.querySelector('meta[name="theme-color"]').content=light?'#f1f2f5':'#101012';document.querySelector('#themeToggle').textContent=light?'☾':'☼'});
      document.addEventListener('keydown',e=>{if(/^[0-9]$/.test(e.key)){appendDigit(e.key);return}if(e.key==='.')document.querySelector('[data-action=decimal]').click();else if(e.key==='Enter'||e.key==='='){e.preventDefault();calculate()}else if(e.key==='Backspace')document.querySelector('[data-action=delete]').click();else if(e.key==='Escape')document.querySelector('[data-action=clear]').click();else if(['+','-','*','/','%'].includes(e.key))appendOp(e.key)});
    })();
  </script>
</body>
</html>
